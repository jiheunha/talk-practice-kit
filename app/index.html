<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Talk Practice</title>
<style>
:root{
  --bg:#f6f7f9; --panel:#ffffff; --ink:#1c2430; --muted:#6b7684; --line:#e3e7ec;
  --accent:#0b4ea2; --hl:#fff1c9; --hl-ink:#1c2430; --done:#9aa4b1;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14181e; --panel:#1c222a; --ink:#e7ebf0; --muted:#97a2b0; --line:#2c343e;
    --accent:#6aa8ff; --hl:#4a3d12; --hl-ink:#fff6dc; --done:#5f6a77;
  }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
header h1{font-size:16px;margin:0;font-weight:650}
header .sp{flex:1}
select,button{font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);color:#fff;border-color:var(--accent);min-width:92px;font-weight:600}
main{flex:1;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px;padding:16px;min-height:0}
.slidebox{display:flex;flex-direction:column;gap:10px;min-height:0}
.slidebox img{width:100%;border:1px solid var(--line);border-radius:8px;background:#fff}
.meta{color:var(--muted);font-size:14px;display:flex;gap:14px;flex-wrap:wrap}
.meta b{color:var(--ink);font-weight:600}
.over{color:#c2410c}
.scriptbox{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px 22px;overflow:auto;min-height:0}
.scriptbox h2{font-size:17px;margin:0 0 4px}
.note{color:var(--muted);font-style:italic;font-size:14px;margin:0 0 10px}
.scriptbox p{margin:0 0 14px;font-size:var(--fs,19px);line-height:1.65}
.s{cursor:pointer;border-radius:4px;padding:1px 2px;transition:background .15s,color .15s}
.s:hover{background:color-mix(in srgb,var(--hl) 50%,transparent)}
.s.past{color:var(--done)}
.s.cur{background:var(--hl);color:var(--hl-ink)}
footer{display:flex;align-items:center;gap:8px;padding:10px 16px;border-top:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
.bar{flex:1;min-width:160px;height:8px;background:var(--line);border-radius:4px;cursor:pointer;position:relative}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:4px;width:0}
.time{font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px;min-width:92px;text-align:right}
label{font-size:14px;color:var(--muted);display:flex;align-items:center;gap:6px}
.keys{color:var(--muted);font-size:12px;padding:0 16px 8px;background:var(--panel)}
@media (max-width:820px){
  main{grid-template-columns:1fr;padding:12px}
  .scriptbox{max-height:none}
  header,footer{padding:8px 12px}
}
</style>
</head>
<body>
<header>
  <h1>Talk practice</h1>
  <select id="sel" aria-label="Slide"></select>
  <span class="sp"></span>
  <span class="meta" id="total"></span>
</header>
<main>
  <section class="slidebox">
    <img id="img" alt="Current slide">
    <div class="meta" id="meta"></div>
  </section>
  <section class="scriptbox" id="box"></section>
</main>
<footer>
  <button id="prevSlide" title="Previous slide (PageUp)">⏮</button>
  <button id="prevS" title="Previous sentence (←)">‹</button>
  <button id="play" class="primary" title="Play / pause (Space)">▶ Play</button>
  <button id="nextS" title="Next sentence (→)">›</button>
  <button id="nextSlide" title="Next slide (PageDown)">⏭</button>
  <div class="bar" id="bar"><i id="fill"></i></div>
  <span class="time" id="time">0:00 / 0:00</span>
  <label>Speed <select id="rate">
    <option>0.8</option><option>0.9</option><option selected>1.0</option><option>1.1</option><option>1.2</option><option>1.3</option>
  </select></label>
  <label><input type="checkbox" id="auto" checked> Continue to next slide</label>
  <label>Text <select id="fs"><option value="17px">S</option><option value="19px" selected>M</option><option value="22px">L</option></select></label>
</footer>
<div class="keys">Space: play/pause · ←/→: sentence · PageUp/PageDown: slide · click a sentence to jump there</div>
<audio id="au" preload="auto"></audio>
<script src="data.js"></script>
<script>
const T = window.TALK, S = T.slides;
const $ = id => document.getElementById(id);
const au = $("au");
let k = 0, spans = [], cur = -1, raf = 0;
const fmt = s => { s = Math.max(0, Math.round(s)); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };
const store = {get(n){try{return localStorage.getItem("talk_"+n)}catch(e){return null}}, set(n,v){try{localStorage.setItem("talk_"+n,v)}catch(e){}}};

S.forEach((s, i) => { const o = document.createElement("option"); o.value = i; o.textContent = s.n + ". " + s.title; $("sel").appendChild(o); });
const main = S.filter(s => s.target), mainDur = main.reduce((a, s) => a + s.dur, 0), mainTarget = main.reduce((a, s) => a + s.target, 0);
$("total").innerHTML = `Main talk audio <b>${fmt(mainDur)}</b> · script target ${fmt(mainTarget)} · voice ${T.voice}`;

function load(i, autoplay){
  k = Math.max(0, Math.min(S.length - 1, i)); const s = S[k];
  $("sel").value = k; store.set("slide", k);
  $("img").src = "img/slide_" + String(s.n).padStart(2, "0") + ".png";
  const box = $("box"); box.innerHTML = `<h2>Slide ${s.n}. ${s.title}</h2>` + (s.note ? `<p class="note">${s.note}</p>` : "");
  spans = []; let p = null, lastPar = -1;
  s.sentences.forEach((x, j) => {
    if (x.par !== lastPar){ p = document.createElement("p"); box.appendChild(p); lastPar = x.par; }
    const sp = document.createElement("span"); sp.className = "s"; sp.textContent = x.text;
    sp.onclick = () => seekTo(j, true); p.appendChild(sp); p.appendChild(document.createTextNode(" ")); spans.push(sp);
  });
  if (!s.sentences.length) box.insertAdjacentHTML("beforeend", "<p class='note'>No script for this slide.</p>");
  meta();
  cur = -1; box.scrollTop = 0;
  au.src = "audio/slide_" + String(s.n).padStart(2, "0") + ".mp3";
  setRate();
  if (autoplay && s.sentences.length) au.play(); else setPlay(false);
  tick();
}
function meta(warn){
  const s = S[k], over = s.target && s.dur / +$("rate").value > s.target;
  $("meta").innerHTML = `Audio <b>${fmt(s.dur)}</b>` + (s.target ? ` · target <b class="${over ? "over" : ""}">${fmt(s.target)}</b>` : " · appendix") +
    ` · ${s.words} words · ${s.words && s.dur ? Math.round(s.words / s.dur * 60) : 0} wpm` +
    (warn ? ` · <b class="over">audio and script timings differ, reload the page (Ctrl+F5)</b>` : "");
}
// Keep the rate across src changes: the media load algorithm resets playbackRate to defaultPlaybackRate.
function setRate(){ const r = +$("rate").value; au.defaultPlaybackRate = r; au.playbackRate = r; au.preservesPitch = true; }
function seekTo(j, play){
  const x = S[k].sentences[j]; if (!x) return;
  au.currentTime = x.start + 0.001; if (play) au.play(); tick();
}
function idxAt(t){
  const ss = S[k].sentences; let j = -1;
  for (let i = 0; i < ss.length; i++) if (t >= ss[i].start - 0.02) j = i;
  return j;
}
function tick(){
  const t = au.currentTime, d = au.duration || S[k].dur;
  $("fill").style.width = (d ? t / d * 100 : 0) + "%";
  $("time").textContent = fmt(t) + " / " + fmt(d);
  const j = idxAt(t);
  if (j !== cur){
    spans.forEach((sp, i) => { sp.classList.toggle("cur", i === j); sp.classList.toggle("past", i < j); });
    cur = j;
    if (spans[j]) spans[j].scrollIntoView({block: "center", behavior: "smooth"});
  }
}
function loop(){ tick(); if (!au.paused) raf = requestAnimationFrame(loop); }
function setPlay(on){ $("play").textContent = on ? "❚❚ Pause" : "▶ Play"; }
au.onplay = () => { setPlay(true); cancelAnimationFrame(raf); loop(); };
au.onpause = () => { setPlay(false); tick(); };
au.onended = () => { setPlay(false); if ($("auto").checked && k < S.length - 1 && S[k + 1].target) setTimeout(() => load(k + 1, true), 1200); };
au.onseeked = tick;
au.onloadedmetadata = () => { setRate(); if (Math.abs(au.duration - S[k].dur) > 0.5) meta(true); };

$("play").onclick = () => au.paused ? au.play() : au.pause();
$("prevSlide").onclick = () => load(k - 1, !au.paused);
$("nextSlide").onclick = () => load(k + 1, !au.paused);
$("prevS").onclick = () => { const j = idxAt(au.currentTime); const x = S[k].sentences[j];
  seekTo(x && au.currentTime - x.start > 1.2 ? j : Math.max(0, j - 1), !au.paused); };
$("nextS").onclick = () => seekTo(Math.min(S[k].sentences.length - 1, idxAt(au.currentTime) + 1), !au.paused);
$("sel").onchange = e => { load(+e.target.value, false); e.target.blur(); };
// Change speed in place (no reload, position kept). Blur so ←/→/Space go back to the player instead of the select.
$("rate").onchange = e => { setRate(); store.set("rate2", e.target.value); meta(); e.target.blur(); };
$("fs").onchange = e => { document.documentElement.style.setProperty("--fs", e.target.value); store.set("fs", e.target.value); e.target.blur(); };
$("auto").onchange = e => store.set("auto", e.target.checked ? "1" : "0");
$("bar").onclick = e => { const r = e.currentTarget.getBoundingClientRect(); au.currentTime = (e.clientX - r.left) / r.width * (au.duration || 0); };
document.addEventListener("keydown", e => {
  if (e.target.tagName === "SELECT") return;
  if (e.code === "Space"){ e.preventDefault(); $("play").click(); }
  else if (e.key === "ArrowRight"){ e.preventDefault(); $("nextS").click(); }
  else if (e.key === "ArrowLeft"){ e.preventDefault(); $("prevS").click(); }
  else if (e.key === "PageDown"){ e.preventDefault(); $("nextSlide").click(); }
  else if (e.key === "PageUp"){ e.preventDefault(); $("prevSlide").click(); }
});

const r0 = store.get("rate2"); if (r0) $("rate").value = r0;
const f0 = store.get("fs"); if (f0){ $("fs").value = f0; document.documentElement.style.setProperty("--fs", f0); }
if (store.get("auto") === "0") $("auto").checked = false;
load(+(store.get("slide") || 0), false);
</script>
</body>
</html>
